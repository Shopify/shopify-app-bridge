# Creates "Version Packages" PRs from pending changesets and publishes to npm
# when those PRs are merged. Versioning and building use separate jobs so
# package build code never runs with repository-write or npm OIDC permissions.
name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Each job declares only the permissions it needs.
permissions: {}

jobs:
  select_mode:
    name: Select release mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      publish_plan_artifact_id: ${{ steps.changesets.outputs['publish-plan-artifact-id'] }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Select release mode
        id: changesets
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Create or update version PR
    if: needs.select_mode.outputs.mode == 'version'
    needs: select_mode
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Create release pull request
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          script: pnpm changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'Version Packages'

  build:
    name: Build and pack release artifacts
    if: needs.select_mode.outputs.mode == 'publish'
    needs: select_mode
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      pack_dir_artifact_id: ${{ steps.pack.outputs['pack-dir-artifact-id'] }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repository
        uses: ./.github/actions/setup

      - name: Validate repository
        uses: ./.github/actions/validate

      - name: Pack publishable packages
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-plan-artifact-id: ${{ needs.select_mode.outputs.publish_plan_artifact_id }}

  publish:
    name: Publish verified artifacts to npm
    if: needs.select_mode.outputs.mode == 'publish'
    needs: [select_mode, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write # Required to push tags and create GitHub releases
      id-token: write # Required for npm trusted publishing
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published_packages: ${{ steps.publish.outputs['published-packages'] }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The setup action installs the Changesets CLI from the frozen lockfile
      # without running dependency lifecycle scripts in this OIDC-enabled job.
      - name: Setup repository
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Publish packed artifacts
        id: publish
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pack-dir-artifact-id: ${{ needs.build.outputs.pack_dir_artifact_id }}
        env:
          # Publishing must not execute package lifecycle scripts in the
          # OIDC-enabled job; the package was already built and packed.
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
